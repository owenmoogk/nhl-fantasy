{%extends "base.html"%}

{%block content %}
    <div id="allTeams">
        <table>
            <tr>
                <th>Team</th>
                <th>Wins</th>
                <th>Losses</th>
                <th>Ties</th>
                <th>Points</th>
                <th></th>
            </tr>
            {%for team in teams %}
                <tr>
                    <td><a href="/teams/{{team.abbreviation}}">{{team.abbreviation}}</a></td>
                    <td>{{team.wins}}</td>
                    <td>{{team.losses}}</td>
                    <td>{{team.ot}}</td>
                    <td>{{team.pts}}</td>
                    <td>
                        {%include "teams/teamFavButton.html"%}
                    </td>
                </tr>
            {%endfor%}
        </table>
    </div>
{%endblock%}
